<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>Voltura Air Webcam Spike</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Isolated feasibility spike</p>
      <h1>Phone as webcam</h1>
      <p>Send video only to the temporary Voltura Air Webcam on this PC.</p>
    </header>

    <video id="preview" autoplay muted playsinline aria-label="Camera preview"></video>

    <section aria-labelledby="controls-title">
      <h2 id="controls-title">Camera</h2>
      <button id="prepare" class="camera-access" type="button" disabled>Allow camera access</button>
      <label>Camera<select id="camera" disabled><option value="">Allow access to list cameras</option></select></label>
      <label>Transport<select id="transport"><option value="direct">Direct LAN</option><option value="relay" disabled>Relay unavailable</option></select></label>
      <div class="actions">
        <button id="start" type="button" disabled>Start webcam</button>
        <button id="stop" type="button" disabled>Stop webcam</button>
      </div>
    </section>

    <section class="status-card" aria-labelledby="status-title">
      <div class="section-heading">
        <h2 id="status-title">Status</h2>
        <span id="overall" class="pill pending">Loading offer</span>
      </div>
      <dl class="diagnostics">
        <div><dt>Environment</dt><dd id="environment">detecting</dd></div>
        <div><dt>Capture</dt><dd id="capture">stopped</dd></div>
        <div><dt>Video</dt><dd id="video-settings">not active</dd></div>
        <div><dt>WebRTC send</dt><dd id="send-settings">not active</dd></div>
        <div><dt>ICE</dt><dd id="ice">new</dd></div>
        <div><dt>Selected route</dt><dd id="route">not selected</dd></div>
        <div><dt>Detail</dt><dd id="detail">Retrieving the encrypted offer.</dd></div>
      </dl>
    </section>
  </main>
  <script src="capture-generation.js?v=20260813-1" defer></script>
  <script src="submitted-peer.js?v=20260813-1" defer></script>
  <script src="app.js?v=20260813-6" defer></script>
</body>
</html>
