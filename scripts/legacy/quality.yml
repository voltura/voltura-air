name: Quality

on:
  workflow_dispatch:
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Setup the pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install dependencies
        shell: pwsh
        run: |
          $packageManager = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm install --global $packageManager --no-audit --fund=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --no-audit --fund=false

      - name: Check documentation map
        run: npm run docs:check

      - name: Check generated UI tokens
        run: npm run ui:tokens:check

      - name: Check source ownership reviews
        run: npm run size:check

      - name: Check host partial ownership
        run: npm run host:ownership:check

      - name: Build mobile client
        run: npm run build --workspace apps/mobile-web

      - name: Restore Windows host tests
        run: dotnet restore tests/VolturaAir.Host.Tests/VolturaAir.Host.Tests.csproj

      - name: Build Windows host tests
        run: dotnet build tests/VolturaAir.Host.Tests/VolturaAir.Host.Tests.csproj --no-restore

      - name: Test mobile client
        run: npm run test:web

      - name: Test automation scripts
        run: npm run test:scripts

      - name: Test Windows host
        run: dotnet test tests/VolturaAir.Host.Tests/VolturaAir.Host.Tests.csproj --no-build --no-restore
